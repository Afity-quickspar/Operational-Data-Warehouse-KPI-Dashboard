name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    name: Build warehouse & run dbt tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline (generate → ingest → dbt build → freshness → export)
        run: python src/orchestrate.py

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report
          path: data/logs/run_report_*.md

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/warehouse_dbt/target/
